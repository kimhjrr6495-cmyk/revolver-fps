<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>HTML FPS - Stage 5.5</title>
  <link rel="stylesheet" href="./style.css?v=5.5.0" />
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>

    <div id="info">
      <strong>STAGE 5.5</strong><br />
      Midpoint Polish
    </div>

    <div id="debug">
      <span id="fps">FPS: --</span>
      <span id="state">GROUND</span>
    </div>
  </div>

  <div id="startScreen">
    <div class="panel">
      <h1>HTML FPS — Stage 5.5</h1>
      <p>Midpoint Polish · Clean Combat Feedback</p>
      <button id="startButton">클릭해서 시작</button>
      <div class="controls">
        <span>WASD — 이동</span>
        <span>Mouse — 시점</span>
        <span>Space — 점프</span>
        <span>좌클릭 — 발사</span>
        <span>1 / 2 — 무기 전환</span>
        <span>R — 재장전</span>
        <span>P — 설정</span>
        <span>T — 적 리셋</span>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main55.js?v=5.5.0"></script>
</body>
</html>
