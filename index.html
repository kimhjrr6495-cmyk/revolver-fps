<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML FPS - Stage 1</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>

    <div id="info">
      <strong>STAGE 1</strong><br />
      WASD 이동 · Space 점프 · 마우스 시점 · ESC 마우스 해제
    </div>

    <div id="debug">
      <span id="fps">FPS: --</span>
      <span id="state">GROUND</span>
    </div>
  </div>

  <div id="startScreen">
    <div class="panel">
      <h1>HTML FPS — Stage 1</h1>
      <p>이동 시스템 테스트</p>
      <button id="startButton">클릭해서 시작</button>
      <div class="controls">
        <span>WASD — 이동</span>
        <span>Mouse — 시점</span>
        <span>Space — 점프</span>
        <span>ESC — 마우스 해제</span>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
